name: CD

# Deploys the only environment with a machine today: staging, on the Ubuntu host.
#   dev    → developer machines; CI only
#   master → production; CI builds and publishes the image. A production deploy (and its GitHub
#            environment) is added here when a production host exists.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [staging]
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy to
        required: true
        type: choice
        options: [staging]
      tag:
        description: Image tag (git SHA) to deploy
        required: true

permissions:
  contents: read
  packages: read

jobs:
  deploy:
    name: Deploy to staging
    # Only successful CI runs triggered by a push; never pull-request code.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: [self-hosted, aegis-host]
    environment: staging
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    env:
      TARGET: staging
      TAG: ${{ github.event.inputs.tag || github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
          sparse-checkout: deploy
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Deploy ${{ env.TAG }} to ${{ env.TARGET }}
        run: deploy/deploy.sh "$TARGET" "$TAG"
      - name: Check ${{ env.TARGET }}
        if: always()
        run: |
          deploy/check.sh "$TARGET" "$TAG" | tee report.txt
          { echo '```'; cat report.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          ! grep -q '✗' report.txt

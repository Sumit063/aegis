name: CD

# Where each branch runs:
#   dev     → developer machines (local/dev profile); CI only, no server deploy
#   staging → the Ubuntu host (automatic deploy, below)
#   master  → production; CI builds the image, deploy enabled once a production host exists
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [staging]
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy to
        required: true
        type: choice
        options: [staging]
      tag:
        description: Image tag (git SHA) to deploy
        required: true

permissions:
  contents: read
  packages: read

jobs:
  deploy:
    name: Deploy to ${{ github.event.inputs.environment || (github.event.workflow_run.head_branch == 'master' && 'prod') || github.event.workflow_run.head_branch }}
    # Only successful CI runs triggered by a push; never pull-request code.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: [self-hosted, aegis-production]
    environment: ${{ github.event.inputs.environment || (github.event.workflow_run.head_branch == 'master' && 'prod') || github.event.workflow_run.head_branch }}
    concurrency:
      group: deploy-${{ github.event.inputs.environment || github.event.workflow_run.head_branch }}
      cancel-in-progress: false
    env:
      TARGET: ${{ github.event.inputs.environment || (github.event.workflow_run.head_branch == 'master' && 'prod') || github.event.workflow_run.head_branch }}
      TAG: ${{ github.event.inputs.tag || github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
          sparse-checkout: deploy
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Deploy ${{ env.TAG }} to ${{ env.TARGET }}
        run: deploy/deploy.sh "$TARGET" "$TAG"

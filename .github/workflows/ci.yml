name: CI

on:
  push:
    branches: [master, staging, dev]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commit-lint:
    name: Commit messages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check Conventional Commits
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then range="$PR_BASE..$PR_HEAD"; else range="$BEFORE..$SHA"; fi
          # New branch or force push: the "before" commit may not exist; check the pushed commit only.
          if ! git cat-file -e "${range%%..*}^{commit}" 2>/dev/null; then range="$SHA~1..$SHA"; fi
          scripts/check-commit-msg.sh --range "$range"

  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Verify (format, tests, architecture, integration, coverage)
        run: ./mvnw -B -ntp verify
      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            aegis-service/target/surefire-reports/
            aegis-service/target/failsafe-reports/
            aegis-service/target/site/jacoco/
          retention-days: 14
      - name: Upload service jar
        uses: actions/upload-artifact@v7
        with:
          name: aegis-jar
          path: aegis-service/target/aegis.jar
          retention-days: 7

  lab:
    name: Exploit Lab
    # Every exploit must succeed against the flawed shop, fail against the careful one, and
    # (from M1) fail through Aegis. lab/run.sh exits non-zero otherwise.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Run every attack
        run: lab/run.sh
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lab-results
          path: lab/RESULTS.md
          retention-days: 14

  failures:
    name: Failure lab
    # Aegis, Kafka and PostgreSQL are each killed (SIGKILL) under genuine traffic (checkout and BBPS
    # bill payments); every order and bill must still settle exactly once. lab/failures.sh exits
    # non-zero otherwise.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Kill each component under load
        run: lab/failures.sh
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: failure-lab-results
          path: lab/FAILURES.md
          retention-days: 14

  npci:
    name: NPCI lab
    # BBPS and UPI through Aegis to the lab's NPCI switch: legitimate flows reach the desk exactly as
    # they happened, every attack (forged, wrapped, XXE, algorithm swaps, replays, double payments,
    # early status checks, wrong amounts, downgrades) is stopped, 300 concurrent payments settle once.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Run every NPCI scenario
        run: lab/npci.sh
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: npci-lab-results
          path: lab/NPCI.md
          retention-days: 14

  partners:
    name: Partner lab
    # Partners calling the shop's recharge API directly (the attacks work) and through two Aegis
    # instances sharing PostgreSQL and Redis: forged, altered, stale and replayed requests, retry
    # storms, reused request IDs, scopes, path traversal, shared rates, Redis and shop failures, and
    # 500 recharges sent twice at once, each executed exactly once (lab/PARTNERS.md).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Run every partner scenario
        run: lab/partners.sh
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: partner-lab-results
          path: lab/PARTNERS.md
          retention-days: 14

  image:
    name: Container image
    # Every push to an environment branch produces an image; CD decides where it goes.
    if: github.event_name == 'push'
    needs: [commit-lint, build, lab, failures, npci, partners]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: aegis-jar
          path: aegis-service/target
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image name
        id: meta
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/aegis" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ github.sha }}
            ${{ steps.meta.outputs.image }}:${{ github.ref_name }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

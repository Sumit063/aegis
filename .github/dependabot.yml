version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
    groups:
      maven:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
  - package-ecosystem: docker
    directories: [/, /deploy/runner]
    schedule:
      interval: weekly
    commit-message:
      prefix: build

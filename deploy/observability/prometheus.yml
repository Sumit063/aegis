# Scrapes Aegis's management port inside the environment's compose network.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: aegis
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["aegis:8081"]

# Connections and applications of one environment (LLD §11). Lives next to .env on the host as
# aegis.yaml and is mounted read-only into the container. Secret values are ${ENV} placeholders
# filled from .env; a missing or short secret stops startup (fail closed).
#
# Example: a shop paying through Razorpay.
#
# aegis:
#   connections:
#     razorpay:                                   # used in URLs: /in/razorpay, /gw/razorpay/...
#       adapter: razorpay
#       application: shop
#       base-url: https://api.razorpay.com
#       settings:
#         key-id: ${RZP_KEY_ID}
#       secrets:
#         key-secret: [ "${RZP_KEY_SECRET}" ]
#         webhook: [ "${RZP_WEBHOOK_SECRET}", "${RZP_WEBHOOK_SECRET_PREVIOUS:}" ]   # current, previous
#     stripe:                                     # /in/stripe, /gw/stripe/...
#       adapter: stripe
#       application: shop
#       secrets:
#         secret-key: [ "${STRIPE_SECRET_KEY}" ]  # sk_test_/rk_test_ outside production
#         webhook: [ "${STRIPE_WEBHOOK_SECRET}", "${STRIPE_WEBHOOK_SECRET_PREVIOUS:}" ]
#     cashfree:                                   # /in/cashfree, /gw/cashfree/...
#       adapter: cashfree
#       application: shop
#       base-url: https://sandbox.cashfree.com/pg   # https://api.cashfree.com/pg only in production
#       settings:
#         client-id: ${CASHFREE_CLIENT_ID}
#       secrets:
#         client-secret: [ "${CASHFREE_CLIENT_SECRET}" ]   # also verifies webhooks
#     bbps:                                       # /in/bbps, /gw/bbps/... (NPCI.md §2)
#       adapter: bbps
#       application: shop
#       base-url: https://bbps-switch.example     # the switch (or the BBPS lab simulator)
#       secrets:
#         signing-key: [ "${BBPS_SIGNING_KEY}" ]  # Aegis's RSA key, PKCS#8 (PEM or base64)
#         switch-certificate: [ "${BBPS_SWITCH_CERTIFICATE}", "${BBPS_SWITCH_CERTIFICATE_PREVIOUS:}" ]
#   applications:
#     shop:
#       api-key: ${SHOP_AEGIS_API_KEY}            # the shop's key for /gw (32+ characters)
#       signing-secret: ${SHOP_AEGIS_SECRET}      # Aegis signs forwards with it (32+ characters)
#       forward-url: https://shop.internal/aegis/messages
#       return-url: https://shop.example/payment/result
#       client-cert-subject: ""                   # e.g. CN=shop to require a client certificate
#       jwe-public-key: ""                        # base64 RSA public key to encrypt forwards
aegis: {}

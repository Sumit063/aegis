# Aegis stack for one environment: PostgreSQL + Kafka (KRaft, single node) + Aegis.
# Servers: deploy/deploy.sh <dev|staging|prod> <tag> runs it as project aegis-<env> with that
#          environment's own .env (secrets, ports, profile). Environments share nothing.
# Laptop:  docker compose -f deploy/compose.yaml -f deploy/compose.local.yaml up -d postgres kafka

services:
  postgres:
    image: postgres:17.11-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: aegis
      POSTGRES_USER: aegis
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aegis-local-only}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aegis -d aegis"]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    image: apache/kafka:4.2.2
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      # Single broker: an acknowledged message must already be on disk (DECISIONS D1).
      KAFKA_LOG_FLUSH_INTERVAL_MESSAGES: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafkadata:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20

  aegis:
    image: ${AEGIS_IMAGE:-ghcr.io/sumit063/aegis}:${AEGIS_TAG:-master}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
      AEGIS_DB_URL: jdbc:postgresql://postgres:5432/aegis
      AEGIS_DB_USER: aegis
      AEGIS_DB_PASSWORD: ${POSTGRES_PASSWORD:-aegis-local-only}
      AEGIS_KAFKA_BOOTSTRAP: kafka:29092
      AEGIS_ROLES: ${AEGIS_ROLES:-ingress,verify,processor,deliverer,admin}
    ports:
      - "127.0.0.1:${AEGIS_HTTP_PORT:-8080}:8080"
      - "127.0.0.1:${AEGIS_MANAGEMENT_PORT:-8081}:8081"

volumes:
  pgdata:
  kafkadata:

# Aegis stack for one environment: PostgreSQL + Kafka (KRaft, single node) + Redis (partner rates)
# + Aegis + daily backups.
# Servers: deploy/deploy.sh <dev|staging|prod> <tag> runs it as project aegis-<env> with that
#          environment's own .env (secrets, ports, profile). Environments share nothing.
# Laptop:  docker compose -f deploy/compose.yaml -f deploy/compose.local.yaml up -d postgres kafka

services:
  postgres:
    image: postgres:17.11-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: aegis
      POSTGRES_USER: aegis
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aegis-local-only}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aegis -d aegis"]
      interval: 5s
      timeout: 3s
      retries: 20

  # One pg_dump a day into ./backups (next to this file), the newest 14 kept (RUNBOOK §5). Dumps
  # hold evidence sealed with the evidence key: they are restorable only together with .env.
  backup:
    image: postgres:17.11-alpine
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: aegis
      PGPASSWORD: ${POSTGRES_PASSWORD:-aegis-local-only}
    volumes:
      - ./backups:/backups
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        umask 077
        while :; do
          f=/backups/aegis-$$(date -u +%F).dump
          if [ ! -s "$$f" ]; then
            if pg_dump -Fc aegis > "$$f.part"; then mv "$$f.part" "$$f" && echo "backup: $$f"; else rm -f "$$f.part"; echo "backup failed"; fi
          fi
          ls -1t /backups/aegis-*.dump 2>/dev/null | tail -n +15 | xargs -r rm -f
          sleep 3600
        done

  kafka:
    image: apache/kafka:4.2.2
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      # Single broker: an acknowledged message must already be on disk (DECISIONS D1).
      KAFKA_LOG_FLUSH_INTERVAL_MESSAGES: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafkadata:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20

  # Partner rates shared by every Aegis instance (DECISIONS D36). Holds counters only, each with a
  # TTL of seconds: nothing to persist or back up; a restart only resets allowances.
  redis:
    image: redis:8.6.8-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "64mb", "--maxmemory-policy", "volatile-ttl"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  aegis:
    image: ${AEGIS_IMAGE:-ghcr.io/sumit063/aegis}:${AEGIS_TAG:-master}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      # Not required to start (partner requests are refused until it answers), only ordered.
      redis:
        condition: service_started
    # Connection and application secrets (the ${...} in aegis.yaml) come from .env as they are.
    env_file:
      - path: .env
        required: false
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
      AEGIS_VERSION: ${AEGIS_TAG:-master}
      AEGIS_DB_URL: jdbc:postgresql://postgres:5432/aegis
      AEGIS_DB_USER: aegis
      AEGIS_DB_PASSWORD: ${POSTGRES_PASSWORD:-aegis-local-only}
      AEGIS_KAFKA_BOOTSTRAP: kafka:29092
      AEGIS_ROLES: ${AEGIS_ROLES:-ingress,checker,gateway,forwarder,admin,partner}
      AEGIS_PARTNER_LIMITER: ${AEGIS_PARTNER_LIMITER:-redis}
      AEGIS_REDIS_URL: redis://redis:6379
      AEGIS_EVIDENCE_KEY: ${AEGIS_EVIDENCE_KEY:?AEGIS_EVIDENCE_KEY must be set in .env}
      AEGIS_ADMIN_API_KEY: ${AEGIS_ADMIN_API_KEY:?AEGIS_ADMIN_API_KEY must be set in .env}
    volumes:
      - ./aegis.yaml:/config/aegis.yaml:ro
    ports:
      - "127.0.0.1:${AEGIS_HTTP_PORT:-8080}:8080"
      - "127.0.0.1:${AEGIS_MANAGEMENT_PORT:-8081}:8081"

volumes:
  pgdata:
  kafkadata:

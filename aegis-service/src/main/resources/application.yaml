# Settings shared by every environment. Environment-specific values live in
# application-{local,dev,staging,prod}.yaml; secrets come only from environment variables.
spring:
  application:
    name: aegis
  profiles:
    # A laptop with no profile set runs as `local`. Servers always set SPRING_PROFILES_ACTIVE.
    default: local
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${AEGIS_DB_URL}
    username: ${AEGIS_DB_USER}
    password: ${AEGIS_DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${AEGIS_KAFKA_BOOTSTRAP}

server:
  port: 8080
  shutdown: graceful

management:
  server:
    port: 8081
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  info:
    env:
      enabled: true
  metrics:
    tags:
      environment: ${aegis.environment}

info:
  environment: ${aegis.environment}

aegis:
  roles: ${AEGIS_ROLES:ingress,verify,processor,deliverer,admin}

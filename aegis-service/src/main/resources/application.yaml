# Settings shared by every environment. Environment-specific values live in
# application-{local,dev,staging,prod}.yaml; secrets come only from environment variables.
spring:
  application:
    name: aegis
  config:
    # Connections and applications of this environment (deploy/aegis.example.yaml). Optional, so a
    # fresh environment starts with none; secrets inside it are ${ENV} placeholders.
    import: optional:file:${AEGIS_CONFIG:/config/aegis.yaml}
  profiles:
    # A laptop with no profile set runs as `local`. Servers always set SPRING_PROFILES_ACTIVE.
    default: local
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${AEGIS_DB_URL}
    username: ${AEGIS_DB_USER}
    password: ${AEGIS_DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${AEGIS_KAFKA_BOOTSTRAP}
    producer:
      # Acknowledged means stored on every in-sync replica, exactly once per send (DECISIONS D6).
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.ByteArraySerializer
      properties:
        enable.idempotence: true
        # Fail within the provider's acknowledgement deadline (Razorpay: 5 s) so it retries.
        max.block.ms: 2000
        request.timeout.ms: 2000
        delivery.timeout.ms: 3000
        linger.ms: 0
    consumer:
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.ByteArrayDeserializer
    listener:
      # Commit each record's offset after its database transaction commits (LLD §3 step 14).
      ack-mode: record
      concurrency: 3

server:
  port: 8080
  shutdown: graceful

management:
  server:
    port: 8081
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        # Ready means the database answers, not just that the process started.
        readiness:
          include: readinessState,db,kafka
  info:
    env:
      enabled: true
  metrics:
    tags:
      environment: ${aegis.environment}

# What is running where; read by deploy/check.sh after every deploy.
info:
  environment: ${aegis.environment}
  version: ${AEGIS_VERSION:local}
  roles: ${aegis.roles}

aegis:
  roles: ${AEGIS_ROLES:ingress,checker,gateway,forwarder,admin,partner}
  admin:
    # Operators' key for /admin/** (generated per environment by deploy.sh).
    api-key: ${AEGIS_ADMIN_API_KEY}
  kafka:
    # Copies of each record and how many must confirm a write. The default suits one broker
    # (development, staging, single-host production): a broker restart loses nothing, the loss of its
    # disk loses what the Checker has not yet stored. Production durability: three brokers,
    # AEGIS_KAFKA_REPLICAS=3 and AEGIS_KAFKA_MIN_INSYNC=2 (RUNBOOK §2). Applies when topics are created.
    replicas: ${AEGIS_KAFKA_REPLICAS:1}
    min-insync-replicas: ${AEGIS_KAFKA_MIN_INSYNC:1}
  partner:
    # Where partner rates are kept: local (this instance) or redis (every instance, DECISIONS D36).
    limiter: ${AEGIS_PARTNER_LIMITER:local}
    redis-url: ${AEGIS_REDIS_URL:redis://localhost:6379}
  evidence:
    # Encrypts every stored message body. Rotate by adding a key and making it current; keep a retired
    # key until no retained record and no kept backup holds data sealed with it (RUNBOOK §6).
    current: k1
    keys:
      k1: ${AEGIS_EVIDENCE_KEY}

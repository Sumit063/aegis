# Production (branch `master`). Live gateway keys. No defaults anywhere: a missing secret stops startup.
logging:
  # One JSON object per line (ECS), so logs are searchable by reference.
  structured:
    format:
      console: ecs
  level:
    dev.aegis: INFO

aegis:
  environment: prod
  network:
    # Production destinations must be https; set true only for a private network you control.
    allow-plain-http: false

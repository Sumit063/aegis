# Lab only. lab/compose.yaml runs two shops: one wired directly to the gateway, one behind Aegis.
server:
  port: 8091

spring:
  application:
    name: vulnshop
  threads:
    virtual:
      enabled: true
  jackson:
    property-naming-strategy: SNAKE_CASE

management:
  endpoints:
    web:
      exposure:
        include: health

shop:
  orders-url: http://localhost:8090/v1/orders
  # Basic rzp_test_lab:lab-key-secret-not-a-real-secret-0001 (lab-only key)
  authorization: Basic cnpwX3Rlc3RfbGFiOmxhYi1rZXktc2VjcmV0LW5vdC1hLXJlYWwtc2VjcmV0LTAwMDE=
  key-secret: lab-key-secret-not-a-real-secret-0001
  webhook-secret: lab-webhook-secret-not-a-real-secret
  aegis-secret: lab-aegis-signing-secret-not-real-0001
  memory: 7d
  flaws: []

# The partner recharge API (M4 lab): direct with a static key, or behind Aegis.
partner-api:
  mode: direct
  api-key: lab-partner-api-key-not-real-0000000001
  aegis-secret: lab-aegis-signing-secret-not-real-0001

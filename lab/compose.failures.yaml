# Failure lab overlay (lab/failures.sh): the gateway retries unacknowledged webhooks, as Razorpay
# does for 24 hours, and the NPCI switch redelivers results until Acked, compressed to minutes.
services:
  mock-gateway:
    environment:
      MOCK_WEBHOOK_RETRY: 5m
  npci-switch:
    environment:
      NPCI_REDELIVER: 5m

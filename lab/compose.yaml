# Exploit Lab: a gateway, a shop wired directly to it, and the same shop behind Aegis.
# Lab-only fake secrets; ports on 127.0.0.1.
#   lab/run.sh            builds, starts this, runs every attack, writes lab/RESULTS.md
name: aegis-lab

x-java: &java
  restart: "no"
  healthcheck:
    test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/$$PORT"]
    interval: 2s
    timeout: 2s
    retries: 60

services:
  mock-gateway:
    <<: *java
    build: { context: .., dockerfile: lab/Dockerfile, args: { MODULE: mock-gateway } }
    environment:
      PORT: 8090
      MOCK_ACCOUNTS_SHOP_WEBHOOK_URL: http://shop-direct:8091/webhooks/razorpay
      # The second shop's Razorpay account: its webhooks are configured to point at Aegis.
      MOCK_ACCOUNTS_AEGIS_KEY_ID: rzp_test_aegis
      MOCK_ACCOUNTS_AEGIS_KEY_SECRET: lab-aegis-key-secret-not-real-0002
      MOCK_ACCOUNTS_AEGIS_WEBHOOK_SECRET: lab-aegis-webhook-secret-not-real-02
      MOCK_ACCOUNTS_AEGIS_WEBHOOK_URL: http://aegis:8080/in/razorpay
    ports: ["127.0.0.1:8090:8090"]

  # The shop integrated directly with the gateway. Flaws are switched per attack (PUT /flaws).
  shop-direct:
    <<: *java
    build: { context: .., dockerfile: lab/Dockerfile, args: { MODULE: vulnshop } }
    environment:
      PORT: 8091
      SHOP_ORDERS_URL: http://mock-gateway:8090/v1/orders
      # Stands in for "7 days" so the F10 replay can be shown in seconds.
      SHOP_MEMORY: 3s
    ports: ["127.0.0.1:8091:8091"]

  # ---- The same shop behind Aegis: only its URLs and credentials differ (EXPLOIT-LAB §1) ----

  postgres:
    image: postgres:17.11-alpine
    restart: "no"
    environment:
      POSTGRES_DB: aegis
      POSTGRES_USER: aegis
      POSTGRES_PASSWORD: lab-only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aegis -d aegis"]
      interval: 2s
      timeout: 2s
      retries: 30

  kafka:
    image: apache/kafka:4.2.2
    restart: "no"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_FLUSH_INTERVAL_MESSAGES: 1
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:29092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 30

  aegis:
    <<: *java
    build: { context: .., dockerfile: Dockerfile }
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
    environment:
      PORT: 8081
      SPRING_PROFILES_ACTIVE: local
      AEGIS_DB_URL: jdbc:postgresql://postgres:5432/aegis
      AEGIS_DB_USER: aegis
      AEGIS_DB_PASSWORD: lab-only
      AEGIS_KAFKA_BOOTSTRAP: kafka:29092
      AEGIS_CONFIG: /config/aegis.yaml
    volumes:
      - ./aegis.yaml:/config/aegis.yaml:ro
    ports: ["127.0.0.1:8080:8080", "127.0.0.1:8081:8081"]

  shop-aegis:
    <<: *java
    build: { context: .., dockerfile: lab/Dockerfile, args: { MODULE: vulnshop } }
    environment:
      PORT: 8092
      SERVER_PORT: 8092
      SHOP_ORDERS_URL: http://aegis:8080/gw/razorpay/validations
      SHOP_AUTHORIZATION: Bearer lab-shop-api-key-for-aegis-not-real-000001
      SHOP_AEGIS_SECRET: lab-aegis-signing-secret-not-real-0001
      # The shop no longer holds any Razorpay secret: Aegis does.
      SHOP_KEY_SECRET: ""
      SHOP_WEBHOOK_SECRET: ""
      SHOP_MEMORY: 3s
    ports: ["127.0.0.1:8092:8092"]
